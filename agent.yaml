name: aws-security-mcp
description: >
  AWS Security MCP Server - A Model Context Protocol server that provides
  AI-powered security scanning for AWS infrastructure. Runs 14 read-only
  security scanner modules (10 unique scanners + 4 aggregation scanners)
  with risk scoring, parallel execution, and a React dashboard.

version: "0.3.1"
license: MIT

architecture:
  type: mcp-server
  transport: stdio
  language: typescript
  runtime: node >= 18
  module_system: esm

entry_points:
  mcp_server: dist/index.js
  cli: dist/bin/aws-security-mcp.js

scanner_modules:
  unique:
    - name: service_detection
      file: src/scanners/service-detection.ts
      description: Detects enabled security services (Security Hub, GuardDuty, Inspector, Config) and assesses maturity
    - name: secret_exposure
      file: src/scanners/secret-exposure.ts
      description: Checks Lambda env vars and EC2 userData for exposed secrets
    - name: ssl_certificate
      file: src/scanners/ssl-certificate.ts
      description: Checks ACM certificates for expiry, failed status, upcoming renewals
    - name: dns_dangling
      file: src/scanners/dns-dangling.ts
      description: Detects Route53 CNAME records pointing to non-existent resources (subdomain takeover)
    - name: network_reachability
      file: src/scanners/network-reachability.ts
      description: Analyzes true network reachability combining Security Group + NACL rules for public EC2 instances
    - name: iam_privilege_escalation
      file: src/scanners/iam-privilege-escalation.ts
      description: Detects IAM privilege escalation paths via policy manipulation, role creation, or service abuse
    - name: public_access_verify
      file: src/scanners/public-access-verify.ts
      description: Verifies actual public accessibility of resources (S3 HTTP check, RDS DNS resolution)
    - name: tag_compliance
      file: src/scanners/tag-compliance.ts
      description: Checks EC2, RDS, S3 resources for required tags (Environment, Project, Owner)
    - name: idle_resources
      file: src/scanners/idle-resources.ts
      description: Finds unused resources (unattached EBS, unused EIPs, stopped instances, unused SGs)
    - name: disaster_recovery
      file: src/scanners/disaster-recovery.ts
      description: Assesses disaster recovery readiness (RDS Multi-AZ, EBS snapshots, S3 versioning)
  aggregation:
    - name: security_hub_findings
      file: src/scanners/security-hub-findings.ts
      description: Aggregates active findings from AWS Security Hub (FSBP, CIS, PCI DSS)
    - name: guardduty_findings
      file: src/scanners/guardduty-findings.ts
      description: Aggregates threat detection findings from Amazon GuardDuty
    - name: inspector_findings
      file: src/scanners/inspector-findings.ts
      description: Aggregates vulnerability findings from Amazon Inspector (CVEs)
    - name: trusted_advisor_findings
      file: src/scanners/trusted-advisor-findings.ts
      description: Aggregates security checks from AWS Trusted Advisor

mcp_tools:
  - scan_all
  - detect_services
  - scan_secret_exposure
  - scan_ssl_certificate
  - scan_dns_dangling
  - scan_network_reachability
  - scan_iam_privilege_escalation
  - scan_public_access_verify
  - scan_tag_compliance
  - scan_idle_resources
  - scan_disaster_recovery
  - scan_security_hub_findings
  - scan_guardduty_findings
  - scan_inspector_findings
  - scan_trusted_advisor_findings
  - scan_group
  - list_groups
  - list_modules
  - generate_report
  - generate_html_report
  - generate_mlps3_report
  - generate_mlps3_html_report
  - generate_maturity_report
  - save_results

mcp_resources:
  - security-rules
  - risk-scoring

mcp_prompts:
  - security-scan
  - analyze-finding

risk_scoring:
  scale: 0-10
  severity_map:
    CRITICAL: 9-10
    HIGH: 7-8.9
    MEDIUM: 4-6.9
    LOW: 0-3.9
  priority_map:
    P0: CRITICAL
    P1: HIGH
    P2: MEDIUM
    P3: LOW

aws:
  mode: read-only
  api_pattern: Describe/Get/List only
  partitions:
    - aws
    - aws-cn
  credential_sources:
    - environment_variables
    - iam_roles
    - aws_profiles

dashboard:
  framework: react
  styling: tailwind
  charts: recharts
  build: vite
  deployment:
    - local (port 3000)
    - s3-static-hosting

compatible_tools:
  - kiro
  - claude-code
  - cursor

ci_cd:
  test: vitest
  lint: tsc --noEmit
  build: tsup
  publish: npm (triggered by v* tags)
  matrix: [node 18, node 20, node 22]
